<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Login | iTunes_Catalog phpMyAdmin Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="overflow: auto;">

<div id="authOverlay" class="auth-overlay">
    <div class="auth-box" id="loginBox">
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username" aria-label="Username" />
        <input type="password" id="loginPassword" placeholder="Password" aria-label="Password" />
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <div class="auth-switch">Don't have an account? <span id="switchToSignup">Signup</span></div>
    </div>
    <div class="auth-box" id="signupBox" style="display:none;">
        <h2>Signup</h2>
        <input type="text" id="signupUsername" placeholder="Username" aria-label="Username" />
        <input type="password" id="signupPassword" placeholder="Password" aria-label="Password" />
        <button id="signupBtn" class="btn btn-success">Signup</button>
        <div class="auth-switch">Already have an account? <span id="switchToLogin">Login</span></div>
    </div>
</div>

<div id="toast" class="toast-message"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
