<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>localhost &raquo; iTunes_Catalog | phpMyAdmin Core Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        body { overflow: auto; height: auto; }
        .auth-overlay { position: static; height: 100vh; }
    </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-box" id="loginBox">
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <div class="auth-switch">Don't have an account? <span id="switchToSignup">Signup</span></div>
    </div>
    <div class="auth-box" id="signupBox" style="display:none;">
        <h2>Signup</h2>
        <input type="text" id="signupUsername" placeholder="Username" />
        <input type="password" id="signupPassword" placeholder="Password" />
        <button id="signupBtn" class="btn btn-success">Signup</button>
        <div class="auth-switch">Already have an account? <span id="switchToLogin">Login</span></div>
    </div>
</div>

<div id="toast" class="toast-message"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    function showToast(msg, isError = false, duration = 3000) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#333';
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
    }

    document.getElementById('switchToSignup').onclick = () => {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('signupBox').style.display = 'block';
    };
    document.getElementById('switchToLogin').onclick = () => {
        document.getElementById('signupBox').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
    };

    document.getElementById('loginBtn').onclick = async () => {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Logging in...';
        try {
            await login(username, password);
            window.location.href = 'music.html';
        } catch (e) {
            showToast(e.message, true);
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    };

    document.getElementById('signupBtn').onclick = async () => {
        const username = document.getElementById('signupUsername').value;
        const password = document.getElementById('signupPassword').value;
        const btn = document.getElementById('signupBtn');
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Signing up...';
        try {
            await signup(username, password);
            showToast('Signup successful! Please login.');
            document.getElementById('switchToLogin').click();
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        } catch (e) {
            showToast(e.message, true);
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    };

    window.onload = async () => {
        const status = await checkAuthStatus();
        if (status.logged_in) {
            window.location.href = 'music.html';
        }
    };
</script>
</body>
</html>
